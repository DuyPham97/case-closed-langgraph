[project]
name = "case-closed-langgraph"
version = "0.1.0"
description = "A small evidence-grounded detective game built with LangChain and LangGraph."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.18,<2",
    "langchain-anthropic>=1.7.0,<2",
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
]

[project.scripts]
case-closed = "case_closed.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/case_closed"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
]
