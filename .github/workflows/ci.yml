name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --dev
      - run: uv run pytest -q
      - run: uv run ruff check src tests evals
      - run: uv run ruff format --check src tests evals
      - run: uv build
